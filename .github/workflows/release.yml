name: Publish Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release (must match Directory.Build.props)'
        required: true
        default: '1.0.1'
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve and validate release version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore and build
        run: |
          dotnet restore CaDesk.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build CaDesk.slnx -c Release --no-restore
      - name: Run core tests
        run: dotnet test tests/CaDesk.Tests -c Release --no-build --logger "trx;LogFileName=release.trx"
      - name: Verify upgrade from the published previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Verify-Upgrade.ps1
      - name: Exercise and render native Windows interface
        run: dotnet run --project tests/CaDesk.WindowsTests -c Release --no-build -- artifacts/windows-checks
      - name: Build and launch the self-contained Windows package
        shell: pwsh
        run: ./scripts/Publish.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-portable-release
          path: artifacts/CA-Desk-v*-win-x64.zip*
          compression-level: 0
      - name: Save development history
        run: git bundle create artifacts/CA-Desk-source.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            artifacts/windows-checks
            artifacts/upgrade-checks
            artifacts/package-verification
            **/TestResults/*.trx
            artifacts/CA-Desk-source.bundle
      - name: Publish versioned GitHub Release with real assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="v$env:RELEASE_VERSION"
          $zip="artifacts/CA-Desk-$tag-win-x64.zip"
          $notes="docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          $existing=gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; releases are immutable." }
          gh release create $tag $zip "$zip.sha256" --target $env:GITHUB_SHA --title "CA Desk $tag — Windows" --notes-file $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release staging failed.' }
          $releaseJson=gh release view $tag --json assets,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify staged release assets.' }
          $release=$releaseJson | ConvertFrom-Json
          $zipName=Split-Path $zip -Leaf
          foreach ($assetName in @($zipName, "$zipName.sha256")) {
            $asset=@($release.assets | Where-Object { $_.name -eq $assetName })
            if ($asset.Count -ne 1 -or $asset[0].size -le 0) { throw "Missing release asset: $assetName" }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
          gh release view $tag --json url,assets
