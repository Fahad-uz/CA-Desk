name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CaDesk.slnx
      - name: Build
        run: dotnet build CaDesk.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/CaDesk.Tests -c Release --no-build --logger "trx;LogFileName=core.trx"
      - name: Verify upgrade from the published previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Verify-Upgrade.ps1
      - name: Exercise and render the native WPF interface
        run: dotnet run --project tests/CaDesk.WindowsTests -c Release --no-build -- artifacts/windows-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-interface-checks
          path: artifacts/windows-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-verification
          path: artifacts/upgrade-checks
      - name: Build and launch the self-contained package
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          ./scripts/Publish.ps1 -Version $props.Project.PropertyGroup.Version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-executable-checks
          path: artifacts/package-verification
      - uses: actions/upload-artifact@v4
        with:
          name: CA-Desk-win-x64
          path: artifacts/CA-Desk-v*-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
