name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CaDesk.slnx
      - name: Build
        run: dotnet build CaDesk.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/CaDesk.Tests -c Release --no-build --logger "trx;LogFileName=core.trx"
      - name: Exercise and render the native WPF interface
        run: dotnet run --project tests/CaDesk.WindowsTests -c Release --no-build -- artifacts/windows-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-interface-checks
          path: artifacts/windows-checks
      - name: Publish portable Windows app
        run: dotnet publish src/CaDesk.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/CA-Desk
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/CA-Desk/* -DestinationPath artifacts/CA-Desk-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CA-Desk-win-x64
          path: artifacts/CA-Desk-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
